[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "fsspec>=2026.9.0",
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
